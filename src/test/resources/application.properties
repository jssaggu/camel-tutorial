# Test defaults: keep the Spring context hermetic so tests do not need external brokers.
# Tests that exercise RabbitMQ (e.g. WeatherRouteTestcontainersTest) re-enable this
# explicitly via @SpringBootTest(properties = "jss.camel.rabbitmq.enabled=true").
jss.camel.rabbitmq.enabled=false
jss.camel.rabbitmq-throttler.enabled=false
jss.camel.rabbitmq-stress-tester.enabled=false
